name: ARM64 Cloud Terminal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Tmate Debug Session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
