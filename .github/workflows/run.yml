name: ARM64 Cloud Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: System Info
        run: |
          echo "=============================="
          echo "ARM64 CLOUD TERMINAL"
          echo "=============================="
          uname -m
          uname -a
          echo "CPU: $(nproc)"
          free -h
          echo "=============================="

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify OpenCode
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: SSH Terminal
        uses: valeriangalliat/action-sshd-cloudflared@v4

      - name: Keep Alive
        run: |
          while true; do
            sleep 60
          done
