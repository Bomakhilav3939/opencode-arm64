name: ARM64 Cloud Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:

      - name: System Info
        run: |
          echo "========================================"
          echo "        ARM64 CLOUD TERMINAL"
          echo "========================================"
          echo "Architecture : $(uname -m)"
          echo "CPU          : $(nproc)"
          free -h
          echo "========================================"

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify OpenCode
        run: |
          export PATH="$HOME/.opencode/bin:$PATH"
          opencode --version

      - name: Install SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

          echo "========================================"
          echo "          PREPARE SSH"
          echo "========================================"

          # Runtime directory SSH
          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          # SSH directory user runner
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Public key Termux
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          # Buat host key sendiri
          mkdir -p "$HOME/sshd"

          ssh-keygen \
            -t ed25519 \
            -f "$HOME/sshd/ssh_host_ed25519_key" \
            -N "" \
            -q

          chmod 600 "$HOME/sshd/ssh_host_ed25519_key"
          chmod 644 "$HOME/sshd/ssh_host_ed25519_key.pub"

          echo "Host key berhasil dibuat."

          # SSH config
          cat > "$HOME/sshd/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1

          HostKey $HOME/sshd/ssh_host_ed25519_key

          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no

          AuthorizedKeysFile $HOME/.ssh/authorized_keys

          PermitRootLogin no
          PermitEmptyPasswords no

          UsePAM no

          X11Forwarding no
          AllowTcpForwarding no
          PermitTunnel no

          PrintMotd no
          PidFile $HOME/sshd/sshd.pid
          EOF

          echo ""
          echo "SSH configuration:"
          cat "$HOME/sshd/sshd_config"

      - name: Validate SSH Configuration
        run: |
          echo "========================================"
          echo "       CHECK SSH CONFIGURATION"
          echo "========================================"

          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          /usr/sbin/sshd \
            -t \
            -f "$HOME/sshd/sshd_config"

          echo ""
          echo "SSH configuration OK."

      - name: Start SSH Server
        run: |
          echo "========================================"
          echo "          STARTING SSH SERVER"
          echo "========================================"

          sudo mkdir -p /run/sshd
          sudo chmod 755 /run/sshd

          /usr/sbin/sshd \
            -f "$HOME/sshd/sshd_config" \
            -E "$HOME/sshd/sshd.log"

          sleep 2

          echo ""
          echo "SSH process:"
          pgrep -af sshd || true

          echo ""
          echo "SSH listening:"
          ss -lntp | grep ':2222' || true

          if ! ss -lnt | grep -q ':2222'; then
            echo ""
            echo "========================================"
            echo "       SSH SERVER GAGAL START"
            echo "========================================"
            echo ""

            cat "$HOME/sshd/sshd.log" || true

            exit 1
          fi

          echo ""
          echo "SSH server AKTIF."
          echo "Local address: 127.0.0.1:2222"

      - name: Install Bore
        run: |
          mkdir -p "$HOME/bin"

          VERSION="0.6.0"

          curl -fL \
            "https://github.com/ekzhang/bore/releases/download/v${VERSION}/bore-v${VERSION}-aarch64-unknown-linux-musl.tar.gz" \
            -o /tmp/bore.tar.gz

          mkdir -p /tmp/bore

          tar -xzf /tmp/bore.tar.gz \
            -C /tmp/bore

          find /tmp/bore \
            -type f \
            -name bore \
            -exec install -m 755 {} "$HOME/bin/bore" \;

          echo "$HOME/bin" >> "$GITHUB_PATH"

          echo "========================================"
          echo "             BORE VERSION"
          echo "========================================"

          "$HOME/bin/bore" --version

      - name: Start Bore Tunnel
        run: |
          export PATH="$HOME/bin:$HOME/.opencode/bin:$PATH"

          echo ""
          echo "========================================"
          echo "          STARTING BORE"
          echo "========================================"

          bore local \
            2222 \
            --to bore.pub \
            > "$HOME/bore.log" 2>&1 &

          BORE_PID=$!

          echo "$BORE_PID" > "$HOME/bore.pid"

          echo "Bore PID: $BORE_PID"

          PORT=""

          for i in $(seq 1 30); do
            sleep 2

            echo "Menunggu Bore... $i/30"

            PORT=$(
              grep -oE 'bore\.pub:[0-9]+' \
                "$HOME/bore.log" \
                | head -n 1 \
                | cut -d: -f2 || true
            )

            if [ -n "$PORT" ]; then
              break
            fi

            if ! kill -0 "$BORE_PID" 2>/dev/null; then
              echo ""
              echo "========================================"
              echo "           BORE GAGAL START"
              echo "========================================"
              cat "$HOME/bore.log"
              exit 1
            fi
          done

          if [ -z "$PORT" ]; then
            echo ""
            echo "========================================"
            echo "       BORE TIDAK MENDAPAT PORT"
            echo "========================================"
            echo ""

            cat "$HOME/bore.log"

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "       ARM64 CLOUD TERMINAL READY"
          echo "========================================"
          echo ""
          echo "HOST : bore.pub"
          echo "PORT : $PORT"
          echo ""
          echo "DARI TERMUX:"
          echo ""
          echo "ssh -i ~/.ssh/opencode_arm64 -p $PORT runner@bore.pub"
          echo ""
          echo "SETELAH MASUK:"
          echo ""
          echo "opencode"
          echo ""
          echo "OpenCode:"
          opencode --version
          echo ""
          echo "========================================"

          echo ""
          echo "Bore log:"
          cat "$HOME/bore.log"

      - name: Keep Runner Alive
        run: |
          echo ""
          echo "========================================"
          echo "        CLOUD TERMINAL AKTIF"
          echo "========================================"
          echo ""
          echo "Jangan hentikan workflow."
          echo ""

          while true; do
            sleep 60
          done
